services:
  - type: web
    name: casacerta-api
    runtime: java
    buildCommand: cd casacerta-api && ./gradlew bootJar -x test
    startCommand: java -jar casacerta-api/build/libs/casacerta-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://casacerta-web.vercel.app
