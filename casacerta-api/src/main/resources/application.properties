# Application
spring.application.name=casacerta-api

# Server
server.port=${PORT:8080}

# Database - H2 (arquivo local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/casacerta;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (acessível em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# JWT
app.jwt.secret=${JWT_SECRET:CasaCertaSecretKey2024SuperSegura!@#MinLength32Chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}